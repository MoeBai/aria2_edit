name: Build aria2 (Manual)

on:
  workflow_dispatch: # 仅保留手动触发

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++-12 \
          autoconf \
          automake \
          autotools-dev \
          autopoint \
          libtool \
          pkg-config \
          libssl-dev \
          libc-ares-dev \
          zlib1g-dev \
          libsqlite3-dev \
          libssh2-1-dev \
          gettext

    - name: Configure autotools
      run: |
        autoreconf -i
        # 使用 OpenSSL，关闭 GnuTLS
        ./configure --without-gnutls --with-openssl CC=gcc-12 CXX=g++-12

    - name: Build aria2c
      run: |
        # 只编译不测试，榨干多核性能
        make -j$(nproc)

    - name: Check binary version
      run: |
        src/aria2c -v

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aria2c-linux-amd64
        path: src/aria2c
        retention-days: 14
